<!-- Entity IMAGE_SKIN -->
<g>
	<rect x="1055" y="66" width="150" height="88" fill="none" stroke="#000000" stroke-width="1.5"/>
	<line x1="1055" y1="92" x2="1205" y2="92" stroke="#000000" stroke-width="1"/>
	<text x="1088" y="84.6" fill="#000000" font-family="Courier New" font-size="14">IMAGE_SKIN</text>
	<text x="1060" y="110.6" fill="#000000" font-family="Courier New" font-size="14">id_image_skin</text>
