	<text x="365" y="146.6" fill="#000000" font-family="Courier New" font-size="14">mot_de_passe_hash</text>
	<text x="365" y="164.6" fill="#000000" font-family="Courier New" font-size="14">date_inscription</text>
</g>

<!-- Entity SKIN -->
<g>
	<rect x="750" y="66" width="115" height="88" fill="none" stroke="#000000" stroke-width="1.5"/>
	<line x1="750" y1="92" x2="865" y2="92" stroke="#000000" stroke-width="1"/>
	<text x="791" y="84.6" fill="#000000" font-family="Courier New" font-size="14">SKIN</text>
	<text x="755" y="110.6" fill="#000000" font-family="Courier New" font-size="14">id_skin</text>
