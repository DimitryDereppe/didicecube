<?xml version="1.0" encoding="utf-8"?>
<!-- MCD Didicecube — construit à la main dans le style visuel de Mocodo
     (le paquet mocodo n'est pas installable dans cet environnement de dev :
     ni pip, ni accès réseau). Source Mocodo texte : mocodo-source.mcd -->
<svg width="1230" height="195" viewBox="0 0 1230 195" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="1230" height="195" fill="#FFFFFF" stroke="none" stroke-width="0"/>

<!-- Association POSSEDER (UTILISATEUR 0,N →PROGRESSION 1,1) -->
<g>
	<line x1="170" y1="110" x2="210" y2="110" stroke="#000000" stroke-width="1"/>
	<line x1="320" y1="110" x2="360" y2="110" stroke="#000000" stroke-width="1"/>
	<rect x="210" y="84" width="110" height="52" fill="#FFFFFF" rx="14" stroke="#000000" stroke-width="1.5"/>
	<line x1="210" y1="110" x2="320" y2="110" stroke="#000000" stroke-width="1"/>
	<text x="231" y="102.6" fill="#000000" font-family="Courier New" font-size="14">POSSEDER</text>
	<text x="182" y="126" fill="#000000" font-family="Courier New" font-size="12">1,1</text>
	<text x="325" y="126" fill="#000000" font-family="Courier New" font-size="12">0,N</text>
</g>

<!-- Association TELECHARGER (UTILISATEUR 0,N →SKIN 1,1) -->
<g>
	<line x1="535" y1="110" x2="575" y2="110" stroke="#000000" stroke-width="1"/>
	<line x1="710" y1="110" x2="750" y2="110" stroke="#000000" stroke-width="1"/>
	<rect x="575" y="84" width="135" height="52" fill="#FFFFFF" rx="14" stroke="#000000" stroke-width="1.5"/>
	<line x1="575" y1="110" x2="710" y2="110" stroke="#000000" stroke-width="1"/>
	<text x="596" y="102.6" fill="#000000" font-family="Courier New" font-size="14">TELECHARGER</text>
	<text x="547" y="126" fill="#000000" font-family="Courier New" font-size="12">0,N</text>
	<text x="715" y="126" fill="#000000" font-family="Courier New" font-size="12">1,1</text>
</g>

<!-- Association COMPOSER (SKIN 0,N →IMAGE_SKIN 1,1) -->
<g>
	<line x1="865" y1="110" x2="905" y2="110" stroke="#000000" stroke-width="1"/>
	<line x1="1015" y1="110" x2="1055" y2="110" stroke="#000000" stroke-width="1"/>
	<rect x="905" y="84" width="110" height="52" fill="#FFFFFF" rx="14" stroke="#000000" stroke-width="1.5"/>
	<line x1="905" y1="110" x2="1015" y2="110" stroke="#000000" stroke-width="1"/>
	<text x="926" y="102.6" fill="#000000" font-family="Courier New" font-size="14">COMPOSER</text>
	<text x="877" y="126" fill="#000000" font-family="Courier New" font-size="12">0,N</text>
	<text x="1020" y="126" fill="#000000" font-family="Courier New" font-size="12">1,1</text>
</g>

<!-- Entity PROGRESSION -->
<g>
	<rect x="20" y="48" width="150" height="124" fill="none" stroke="#000000" stroke-width="1.5"/>
	<line x1="20" y1="74" x2="170" y2="74" stroke="#000000" stroke-width="1"/>
	<text x="49" y="66.6" fill="#000000" font-family="Courier New" font-size="14">PROGRESSION</text>
	<text x="25" y="92.6" fill="#000000" font-family="Courier New" font-size="14">id_progression</text>
