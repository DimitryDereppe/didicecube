# Usage : docker compose up -d db        -> base seule (pour lancer Django depuis .venv)
#         docker compose up --build      -> base + application sur http://localhost:8000
# Les valeurs viennent du fichier .env (copie de .env.example).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    # Port ouvert seulement sur la machine (127.0.0.1), jamais sur le réseau.
    ports:
      - "127.0.0.1:${DB_PORT_HOTE:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    command: sh -c "python manage.py migrate && python manage.py createcachetable && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${WEB_PORT_HOTE:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  donnees_postgres:
