# Usage : docker compose -f docker-compose.prod.yml up -d --build   (sur le serveur, avec le .env de production)
# Voir README, « Mise en production ». Seul Caddy est joignable de l'extérieur (ports 80 et 443).
x-journaux: &journaux
  # Journaux Docker limités à 5 fichiers de 10 Mo par service (sinon ils grossissent sans fin).
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - donnees_postgres_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    <<: *journaux

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DEBUG: "false"
      DERRIERE_PROXY: "true"
    volumes:
      - statiques:/app/staticfiles
      # Images des skins déposées par les utilisateurs (servies par Django, propriétaire seul).
      - medias:/app/media
    healthcheck:
      # Appelle /sante/ comme le ferait Caddy (nom de domaine, HTTPS déjà terminé).
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/sante/', headers={'Host': os.environ['DOMAINE'], 'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    <<: *journaux

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    environment:
      DOMAINE: ${DOMAINE}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - statiques:/srv/statiques:ro
      - caddy_donnees:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    <<: *journaux

volumes:
  donnees_postgres_production:
  medias:
  statiques:
  caddy_donnees:
  caddy_config:
